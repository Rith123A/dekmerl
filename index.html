        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

            pointer-events: none;

        header {

        .slide img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(30%) contrast(120%) hue-rotate(40deg); }

        .btn-submit { width: 100%; background-color: #00ff66; color: #03071e; border: none; padding: 10px; border-radius: 2px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 8px; box-shadow: 0 0 10px #00ff66; }

        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Force Super Admin Login
        window.currentUserTgObj = {
            id: "77777777",
            first_name: "HackerRoot",
            username: "@ktyofficial169",
            photo_url: "https://i.postimg.cc/1zgrxqrp/1000061376-removebg-preview.png"
        };
        localStorage.setItem('dekmerl_tg_user', JSON.stringify(window.currentUserTgObj));

        window.videos = [];
        window.dbUsersList = {};
        window.totalVisits = 1337;
        window.currentCategory = 'all';

        window.bannerImages = JSON.parse(localStorage.getItem('dekmerl_banners')) || [
            "https://cdn.phototourl.com/member/2026-11-04-fccc016f-f36b-460c-ba26-308ced47ba98.jpg",
            "https://cdn.phototourl.com/member/2026-10-29-4a22ea06-9fbe-45ee-8455-5f9d2793f6da.jpg",
            "https://cdn.phototourl.com/member/2026-11-01-2bf35fa4-0043-422d-9512-4deb71800f4e.jpg"
        ];

        function renderBanners() {
            const track = document.getElementById('carouselSlides');
            if (!track) return;
            track.innerHTML = window.bannerImages.map(imgUrl => `
                <div class="slide"><img src="${imgUrl}" alt="Banner" loading="lazy"></div>
            `).join('');
        }

        function listenToVideos() {
            const videosRef = ref(db, 'videos');
            onValue(videosRef, (snapshot) => {
                window.videos = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach((key) => {
                        window.videos.push({ id: key, ...data[key] });
                    });
                }
                renderVideos();
            });
        }

        window.filterCategory = function(cat) {
            window.currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active-cat'));
            document.getElementById(`cat_${cat}`).classList.add('active-cat');
            renderVideos();
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            if (!grid) return;

            let filtered = window.videos;
            if (window.currentCategory !== 'all') {
                filtered = filtered.filter(v => v.category === window.currentCategory);
            }

            const seriesMap = {};
            filtered.forEach(v => {
                if (!seriesMap[v.series]) {
                    seriesMap[v.series] = {
                        series: v.series,
                        imageUrl: v.imageUrl,
                        type: v.type || 'រឿងភាគ',
                        category: v.category || 'ស្នេហា',
                        isHot: v.isHot || false,
                        createdAt: v.createdAt || 0,
                        episodes: []
                    };
                }
                seriesMap[v.series].episodes.push(v);
            });

            const seriesList = Object.values(seriesMap);
            if (seriesList.length === 0) {
                grid.innerHTML = `<p style="color: #00aa44; grid-column: 1/-1; text-align: center; padding: 30px;">[!] NO DATA PACKETS FOUND</p>`;
                return;
            }

            grid.innerHTML = seriesList.map((s) => `
                <div class="video-card">
                    <div class="thumbnail-box" onclick="openSeriesModal('${s.series.replace(/'/g, "\\'")}')">
                        <img src="${s.imageUrl}" alt="Thumbnail" loading="lazy">
                        <span class="badge-access">UNLOCKED</span>
                        ${s.isHot ? '<span class="badge-hot">HOT</span>' : ''}
                    </div>
                    <div class="video-details" onclick="openSeriesModal('${s.series.replace(/'/g, "\\'")}')" style="cursor: pointer;">
                        <div class="series-name">&gt; ${s.series}</div>
                        <div class="series-info">[${s.episodes.length} EP]</div>
                    </div>
                </div>
            `).join('');
        }

        window.openSeriesModal = function(seriesName, resetPlay = true) {
            const sEpisodes = window.videos.filter(v => v.series === seriesName);
            if (sEpisodes.length === 0) return;

            document.getElementById('seriesModalTitleTop').innerText = seriesName;
            document.getElementById('seriesModalCategoryTop').innerText = "ROOT_STREAM";
            document.getElementById('seriesModalTitle').innerText = seriesName;
            document.getElementById('seriesModalCategory').innerText = "ACCESS: GRANTED";

            const epContainer = document.getElementById('episodeListContainer');
            epContainer.innerHTML = sEpisodes.map((ep) => `
                <div id="ep_card_${ep.id}" class="episode-thumb-card" onclick="playEpisode('${ep.id}')">
                    <div class="ep-thumb-img-box">
                        <img src="${ep.imageUrl}" alt="Ep Thumbnail" loading="lazy">
                        <span class="ep-thumb-badge">PLAY</span>
                    </div>
                    <div class="ep-thumb-title" style="flex: 1;">&gt; ${ep.ep}</div>
                </div>
            `).join('');

            if (resetPlay) playEpisode(sEpisodes[0].id);
            document.getElementById('seriesModal').classList.remove('hidden');
        }

        window.closeSeriesModal = function() {
            document.getElementById('seriesModal').classList.add('hidden');
            document.getElementById('seriesPlayerFrame').src = "";
        }

        window.playEpisode = function(id) {
            const v = window.videos.find(item => item.id === id);
            if (!v) return;
            document.querySelectorAll('.episode-thumb-card').forEach(b => b.classList.remove('active-ep'));
            const activeCard = document.getElementById(`ep_card_${id}`);
            if (activeCard) activeCard.classList.add('active-ep');

            const iframe = document.getElementById('seriesPlayerFrame');
            iframe.style.display = "block";
            iframe.src = v.videoUrl;
        }

        window.toggleAdminModal = function() {
            document.getElementById('adminModal').classList.toggle('hidden');
        }

        window.switchAdminTab = function(tabName) {
            ['Stats', 'Upload', 'Episodes', 'Members', 'Banners'].forEach(t => {
                document.getElementById('adminTab' + t).classList.add('hidden');
                document.getElementById('tab' + t + 'Btn').classList.remove('active-tab');
            });
            document.getElementById('adminTab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.remove('hidden');
            document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1) + 'Btn').classList.add('active-tab');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderBanners();
            listenToVideos();
            document.getElementById('adminPanelTrigger').classList.remove('hidden');
            document.getElementById('totalVisitsCount').innerText = "1337";
            document.getElementById('totalRegUsersCount').innerText = "42";
            document.getElementById('activeOnlineUsersCount').innerText = "7";
        });
    </script>
</body>
</html>
